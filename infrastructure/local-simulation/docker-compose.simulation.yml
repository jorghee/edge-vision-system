version: "3.8"

# Laptop deployment: all services in Docker, including eKuiper with
# Video Source capturing from USB webcam. No standalone detector.

networks:
  edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  ekuiper-data:
  ekuiper-log:

services:

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - edge-net

  ekuiper:
    build: ../../services/ekuiper-engine
    container_name: ekuiper-engine
    restart: unless-stopped
    privileged: true
    ports:
      - "9081:9081"
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt:1883"
      KUIPER__PORTABLE__PYTHON_BIN: "python3"
      MODELS_DIR: "/kuiper/models"
      CAMERA_ID: "${CAMERA_ID:-cam-01}"
      CONFIDENCE_THR: "${CONFIDENCE_THR:-0.45}"
      CAMERA_FPS: "${CAMERA_FPS:-2}"
    devices:
      - "/dev/video2:/dev/video2"
    volumes:
      - ekuiper-data:/kuiper/data
      - ekuiper-log:/kuiper/log
      - ../../services/ekuiper-engine/plugins/ppe_inference:/kuiper/plugins/portables/ppe_inference
      - ../../services/ai-models/models:/kuiper/models
      - ./config/ekuiper/video.yaml:/kuiper/etc/sources/video.yaml
    depends_on:
      - mqtt
    networks:
      - edge-net

  action_service:
    build: ../../services/action-service
    container_name: edge-actions
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      ALERT_TOPIC: edge/alerts
      ACTION_TOPIC: edge/actions
    depends_on:
      - mqtt
    networks:
      - edge-net
