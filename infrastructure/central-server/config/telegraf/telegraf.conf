# Telegraf Configuration for Edge Vision System
# Subscribes to MQTT topics and writes to InfluxDB

[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  flush_jitter = "2s"

# OUTPUT: InfluxDB 2.x

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "edge-vision"
  bucket = "edge-data"

# INPUT: MQTT Consumer - PPE Events (edge/alerts)

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["edge/alerts"]
  qos = 1
  data_format = "json_v2"
  topic_tag = "mqtt_topic"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "ppe_events"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "detection.camera_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detection.persons_detected"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detection.snapshot"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detection.timestamp"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "detection.violators"
      tags = ["severity", "event_type"]

# INPUT: MQTT Consumer - Monitor Events (edge/monitor)

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["edge/monitor"]
  qos = 0
  data_format = "json_v2"
  topic_tag = "mqtt_topic"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "ppe_events"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "detection.camera_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detection.persons_detected"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "detection.timestamp"
      type = "string"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "detection.violators"
      tags = ["severity", "event_type"]

# INPUT: MQTT Consumer - Device Metrics (edge/metrics/#)

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  topics = ["edge/metrics/#"]
  qos = 0
  data_format = "json_v2"
  topic_tag = "mqtt_topic"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "device_metrics"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "camera_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "cpu_percent"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "memory_percent"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "memory_used_mb"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature_c"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "disk_percent"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "net_bytes_tx"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "net_bytes_rx"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "uptime_seconds"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "containers_total"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "containers_running"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ekuiper_status"
      type = "string"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "frames_processed"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "inference_latency_ms"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "inference_errors"
      type = "int"
