# Mosquitto config for the CENTRAL SERVER
# Accepts connections from edge devices (RPi) over the LAN

# MQTT standard port - listens on all interfaces
listener 1883

# Authentication: require username/password
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# WebSocket port (for dashboards/GUI)
listener 9001
protocol websockets
