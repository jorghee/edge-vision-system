version: "3.8"

networks:
  edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  ekuiper-data:
  ekuiper-log:

services:

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - edge-net

  ekuiper:
    image: lfedge/ekuiper:1.13-alpine
    container_name: ekuiper-engine
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt:1883"
    volumes:
      - ekuiper-data:/kuiper/data
      - ekuiper-log:/kuiper/log
    depends_on:
      - mqtt
    networks:
      - edge-net

  detector:
    build: ./services/detector
    container_name: edge-detector
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC: camera/events
      CAMERA_ID: cam-01
      CAMERA_INDEX: "2"
      CAMERA_BACKEND: "opencv"
      INTERVAL_SEC: "3"
      USE_SIMULATION: "false"
      MODEL_PATH: "/app/models/yolov8n.pt"
      CONFIDENCE_THR: "0.45"
      CAPTURE_WIDTH: "640"
      CAPTURE_HEIGHT: "480"
    depends_on:
      - mqtt
    networks:
      - edge-net
    devices:
      - /dev/video2:/dev/video2

  action_service:
    build: ./services/action_service
    container_name: edge-actions
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      ALERT_TOPIC: edge/alerts
      ACTION_TOPIC: edge/actions
    depends_on:
      - mqtt
    networks:
      - edge-net
