version: "3.8"

# eKuiper-native architecture:
#   MediaMTX captures CSI camera via libcamera -> RTSP stream
#   eKuiper Portable Plugin reads RTSP, runs AI inference, publishes to MQTT

networks:
  edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  ekuiper-data:
  ekuiper-log:

services:

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - edge-net

  # MediaMTX: RTSP server with native RPi camera support via libcamera.
  # Exposes the CSI camera as an RTSP stream at rtsp://mediamtx:8554/cam
  mediamtx:
    image: bluenviron/mediamtx:1-rpi
    container_name: mediamtx
    restart: unless-stopped
    privileged: true
    tmpfs:
      - /dev/shm:exec
    volumes:
      - /run/udev:/run/udev:ro
    environment:
      MTX_PATHS_CAM_SOURCE: "rpiCamera"
      MTX_PATHS_CAM_RPICAMERAWIDTH: "640"
      MTX_PATHS_CAM_RPICAMERAHEIGHT: "480"
    networks:
      - edge-net

  ekuiper:
    build: ./services/ekuiper
    container_name: ekuiper-engine
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt:1883"
      KUIPER__PORTABLE__PYTHON_BIN: "python3"
      MODELS_DIR: "/kuiper/models"
      CAMERA_ID: "cam-rpi-01"
      CONFIDENCE_THR: "0.45"
      RTSP_URL: "rtsp://mediamtx:8554/cam"
    volumes:
      - ekuiper-data:/kuiper/data
      - ekuiper-log:/kuiper/log
      - ./services/ekuiper/plugins/ppe_inference:/kuiper/plugins/portables/ppe_inference
      - ./services/detector/models:/kuiper/models
      - ./infrastructure/ekuiper/sources/cameraSource.yaml:/kuiper/etc/sources/cameraSource.yaml
    depends_on:
      - mqtt
      - mediamtx
    networks:
      - edge-net

  action_service:
    build: ./services/action_service
    container_name: edge-actions
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      ALERT_TOPIC: edge/alerts
      ACTION_TOPIC: edge/actions
    depends_on:
      - mqtt
    networks:
      - edge-net
