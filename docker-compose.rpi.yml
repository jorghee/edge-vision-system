version: "3.8"

# The detector runs natively (outside Docker) for direct access to the CSI
# camera via Picamera2. Only infrastructure services run in Docker.

networks:
  edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  ekuiper-data:
  ekuiper-log:

services:

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - edge-net

  # slim instead of alpine for ARM64 compatibility
  ekuiper:
    image: lfedge/ekuiper:1.13-slim
    container_name: ekuiper-engine
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt:1883"
    volumes:
      - ekuiper-data:/kuiper/data
      - ekuiper-log:/kuiper/log
    depends_on:
      - mqtt
    networks:
      - edge-net

  action_service:
    build: ./services/action_service
    container_name: edge-actions
    restart: unless-stopped
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      ALERT_TOPIC: edge/alerts
      ACTION_TOPIC: edge/actions
    depends_on:
      - mqtt
    networks:
      - edge-net
