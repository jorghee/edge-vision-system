# Edge Device (Raspberry Pi 4): Camera + AI Inference
#
# Captures video via MediaMTX (libcamera), processes with eKuiper + YOLOv8,
# and publishes detection results to the CENTRAL SERVER's MQTT broker.
#
# Usage:
#   MQTT_SERVER_URL=tcp://192.168.1.100:1883 docker compose -f docker-compose.rpi.yml up -d
#
# Environment variables:
#   MQTT_SERVER_URL  - Central server MQTT broker (required, e.g. tcp://192.168.1.100:1883)
#   MQTT_USERNAME    - MQTT auth username (default: edge_device)
#   MQTT_PASSWORD    - MQTT auth password (default: SecureEdge2026!)
#   CAMERA_ID        - Unique identifier for this camera (default: cam-rpi-01)

networks:
  edge-net:
    driver: bridge

volumes:
  ekuiper-data:
  ekuiper-log:

services:

  # MediaMTX: RTSP server with native RPi camera support via libcamera.
  # Exposes the CSI camera as an RTSP stream at rtsp://mediamtx:8554/cam
  mediamtx:
    image: bluenviron/mediamtx:1-rpi
    container_name: mediamtx
    restart: unless-stopped
    privileged: true
    tmpfs:
      - /dev/shm:exec
    volumes:
      - /run/udev:/run/udev:ro
    environment:
      MTX_PATHS_CAM_SOURCE: "rpiCamera"
      MTX_PATHS_CAM_RPICAMERAWIDTH: "640"
      MTX_PATHS_CAM_RPICAMERAHEIGHT: "480"
    networks:
      - edge-net

  ekuiper:
    build: ./services/ekuiper
    container_name: ekuiper-engine
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      # MQTT: points to the CENTRAL SERVER (configurable)
      MQTT_SERVER_URL: "${MQTT_SERVER_URL:?Set MQTT_SERVER_URL to the central server, e.g. tcp://192.168.1.100:1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-edge_device}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-SecureEdge2026!}"
      # eKuiper internals
      KUIPER__PORTABLE__PYTHON_BIN: "python3"
      KUIPER__PORTABLE__INITTIMEOUT: "120000"
      KUIPER__PORTABLE__SENDTIMEOUT: "120000"
      # AI inference
      MODELS_DIR: "/kuiper/models"
      CAMERA_ID: "${CAMERA_ID:-cam-rpi-01}"
      CONFIDENCE_THR: "0.45"
      RTSP_URL: "rtsp://mediamtx:8554/cam"
    volumes:
      - ekuiper-data:/kuiper/data
      - ekuiper-log:/kuiper/log
      - ./services/ekuiper/plugins/ppe_inference:/kuiper/plugins/portables/ppe_inference
      - ./services/detector/models:/kuiper/models
      - ./infrastructure/ekuiper/sources/cameraSource.yaml:/kuiper/etc/sources/cameraSource.yaml
    depends_on:
      - mediamtx
    networks:
      - edge-net
